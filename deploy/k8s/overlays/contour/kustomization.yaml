# Example environment for a cluster with Contour (HTTPProxy) instead of ingress-nginx,
# autoscaled with components/hpa. Copy this folder per cluster and set the share, host
# and image tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wavy

resources:
  - ../../base

components:
  - ../../components/prometheus-operator
  - ../../components/hpa
  - ../../components/contour

images:
  - name: ghcr.io/kobalt42z/wavy-server
    newTag: "0.2.0"

configMapGenerator:
  - name: wavy-server-env
    behavior: merge
    literals:
      # The web app's origin. Listed origins may send cookies (the sticky-session cookie).
      - CORS_ORIGINS=https://app.example.local

patches:
  # Point the PersistentVolume at the real share.
  - target:
      kind: PersistentVolume
      name: wavy-media
    patch: |-
      - op: replace
        path: /spec/csi/volumeAttributes/source
        value: //fileserver.example.local/media
  # Public host for the playback API.
  - target:
      kind: HTTPProxy
      name: wavy-server
    patch: |-
      - op: replace
        path: /spec/virtualhost/fqdn
        value: wavy.example.local
