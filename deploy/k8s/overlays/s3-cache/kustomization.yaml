# Example environment playing S3 presigned links through the slice cache:
# overlays/hpa plus components/s3-cache. Copy per cluster and set the share,
# host, image tag and the bucket host (twice: wavy's allowlist and the cache's).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wavy

resources:
  - ../../base

components:
  - ../../components/prometheus-operator
  - ../../components/hpa
  - ../../components/s3-cache

images:
  - name: ghcr.io/kobalt42z/wavy-server
    newTag: "0.2.0"

configMapGenerator:
  - name: wavy-server-env
    behavior: merge
    literals:
      - CORS_ORIGINS=https://app.example.local
      - REMOTE_ALLOWED_HOSTS=evidence.s3.eu-west-1.amazonaws.com

patches:
  - target:
      kind: PersistentVolume
      name: wavy-media
    patch: |-
      - op: replace
        path: /spec/csi/volumeAttributes/source
        value: //fileserver.example.local/media
  - target:
      kind: Ingress
      name: wavy-server
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: wavy.example.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: wavy.example.local
  # The cache may fetch from the same bucket only.
  - target:
      kind: Deployment
      name: wavy-cache
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: '^evidence\.s3\.eu-west-1\.amazonaws\.com$'
