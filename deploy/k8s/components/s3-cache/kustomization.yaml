# Read-through slice cache in front of S3 for remote (presigned URL) playback.
# One shared nginx pod with a 100 Gi volume; every wavy-server replica reads
# remote files through it (REMOTE_CACHE_URL), and falls back to reading S3
# directly when it's down. See README "S3 slice cache".
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - cache.yaml

configMapGenerator:
  # The nginx site; the image's entrypoint fills in ${WAVY_CACHE_*} at start.
  - name: wavy-cache-config
    files:
      - wavy-cache.conf.template
    options:
      labels:
        app.kubernetes.io/name: wavy-cache
        app.kubernetes.io/part-of: wavy
  - name: wavy-server-env
    behavior: merge
    literals:
      - REMOTE_CACHE_URL=http://wavy-cache:8080
      - REMOTE_CACHE_TIMEOUT_MS=5000
