# The cache's disk. 100 Gi; nginx's cap (WAVY_CACHE_MAX_SIZE) is 90g so it never
# fills the volume: nginx evicts the least recently used slices in the background
# and can briefly go over its cap, and the filesystem needs some room of its own.
# Raise both together and keep the cap ~10% under the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wavy-cache
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName: fast-ssd   # the cluster default otherwise; SSD-backed is best
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wavy-cache
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  # One pod: the volume is ReadWriteOnce. While it restarts, wavy reads S3 directly.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate # the old pod must release the volume first
  selector:
    matchLabels:
      app.kubernetes.io/name: wavy-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wavy-cache
        app.kubernetes.io/part-of: wavy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx in the unprivileged image
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch # don't re-chown 100 Gi of slices on every start
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Origin hosts it may fetch from, as a regex on host[:port]. Keep it in
            # line with wavy's REMOTE_ALLOWED_HOSTS. Overlays set the real bucket.
            - name: WAVY_CACHE_HOSTS
              value: '^[a-z0-9.-]+\.s3\.[a-z0-9-]+\.amazonaws\.com$'
            - name: WAVY_CACHE_MAX_SIZE
              value: 90g
            - name: WAVY_CACHE_INACTIVE
              value: 24h
            - name: WAVY_CACHE_SLICE
              value: 4m
            - name: WAVY_CACHE_DIR
              value: /var/cache/nginx/wavy
            - name: WAVY_CACHE_CA_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            # Fills NGINX_LOCAL_RESOLVERS from /etc/resolv.conf (cluster DNS).
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          # Requests equal limits, like wavy-server. nginx itself needs little; the
          # kernel page cache over the volume does the heavy lifting.
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx/wavy
            - name: templates
              mountPath: /etc/nginx/templates
              readOnly: true
            # The rendered site goes here; empty, so the image's default site is gone.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp # pid file and nginx temp files
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: wavy-cache
        - name: templates
          configMap:
            name: wavy-cache-config
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wavy-cache
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wavy-cache
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Only wavy-server pods may talk to the cache. Cached slices are served without
# asking S3 again, so nothing else in the cluster may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wavy-cache
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wavy-cache
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wavy-server
      ports:
        - port: http
          protocol: TCP
