# Contour (HTTPProxy) instead of ingress-nginx. Replaces the base Ingress with an
# HTTPProxy that keeps each browser on one pod with a cookie, like the Ingress does.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - httpproxy.yaml
patches:
  - target:
      kind: Ingress
      name: wavy-server
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: wavy-server
