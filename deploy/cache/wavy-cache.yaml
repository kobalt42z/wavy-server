# wavy-cache: the S3 slice cache, as plain YAML. Step-by-step guide: deploy/cache/README.md.
#
#   kubectl apply -f wavy-cache.yaml
#
# Then point wavy-server at it (REMOTE_ALLOWED_HOSTS and REMOTE_CACHE_URL in its
# settings ConfigMap) and restart it:
#   kubectl -n wavy rollout restart deployment/wavy-server
#
# Values to change are marked CHANGE ME: the bucket host regex (WAVY_CACHE_HOSTS),
# the image if you pull through your own registry, and the storage class.
# -------------------------------------------------------------------------------------
# 1. The nginx site. The nginx image fills in the ${WAVY_CACHE_*} values from the
#    Deployment's env when it starts (file names ending in .template).
# -------------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: wavy-cache-config
  namespace: wavy
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
data:
  wavy-cache.conf.template: |               # "|" keeps the lines below as one text block
    # wavy-cache: a read-through slice cache in front of S3 (or any range-capable
    # HTTP origin). Wavy sends remote media reads here instead of to S3:
    #
    #   http://wavy-cache:8080/<scheme>/<host[:port]>/<version>/<path>?<presigned query>
    #
    # <version> is a hash of the object's ETag that wavy got from the origin when it
    # checked the link, so an overwritten object gets new slices. It's dropped before
    # the request goes to the origin.
    #
    # nginx splits every file into fixed slices, fetches only the slices that are
    # read, and keeps them on disk. A seek inside a cached slice costs nothing, so
    # file layouts that make FFmpeg jump around (AVI indexes, MP4 moov at the end)
    # stop costing one S3 request per jump, and repeat views come from disk.
    #
    # Rendered by the nginx image's entrypoint (envsubst of ${VARS}) into
    # /etc/nginx/conf.d. Settings:
    #   WAVY_CACHE_HOSTS     regex of origin hosts it may fetch from (anything else is 403)
    #   WAVY_CACHE_MAX_SIZE  disk cap, kept below the volume size (nginx can overshoot briefly)
    #   WAVY_CACHE_INACTIVE  slices not read for this long are dropped
    #   WAVY_CACHE_SLICE     slice size
    #   WAVY_CACHE_DIR       cache directory (the PersistentVolume)
    #   NGINX_LOCAL_RESOLVERS  set by the image (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1)

    proxy_cache_path ${WAVY_CACHE_DIR} levels=1:2 keys_zone=wavy:32m
                     max_size=${WAVY_CACHE_MAX_SIZE} inactive=${WAVY_CACHE_INACTIVE}
                     use_temp_path=off;

    # Origin hosts the cache may fetch from. Wavy checks REMOTE_ALLOWED_HOSTS before it
    # builds a cache URL; this is the same list again, so the cache is never an open proxy.
    map $origin_host $origin_allowed {
        default 0;
        "~${WAVY_CACHE_HOSTS}" 1;
    }

    server {
        listen 8080 default_server;
        server_tokens off;
        resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
        resolver_timeout 5s;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location ~ ^/(?<origin_scheme>https?)/(?<origin_host>(?<origin_name>[A-Za-z0-9.-]+)(?::[0-9]+)?)/(?<object_version>[a-z0-9]+)(?<origin_path>/.*)$ {
            if ($origin_allowed = 0) {
                return 403 "origin host not allowed\n";
            }
            limit_except GET { deny all; }

            slice ${WAVY_CACHE_SLICE};
            proxy_cache wavy;
            # The key leaves out the query: presigned links carry a new signature each
            # time, and the same object must hit the same slices. Wavy builds cache URLs
            # only after the origin accepted that exact link (and its token), and only
            # wavy pods can reach this service (NetworkPolicy).
            proxy_cache_key $origin_scheme://$origin_host/$object_version$origin_path$slice_range;
            proxy_cache_valid 200 206 ${WAVY_CACHE_INACTIVE};
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_use_stale error timeout updating;
            # S3 sends no-cache headers for presigned GETs; the cache decides here.
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
            proxy_hide_header Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;

            # $uri is decoded; $request_uri keeps the original encoding the signature covers.
            set $origin_request_path $origin_path;
            if ($request_uri ~ ^/https?/[^/]+/[a-z0-9]+(?<raw_path>/[^?]*)) {
                set $origin_request_path $raw_path;
            }
            proxy_pass $origin_scheme://$origin_host$origin_request_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Presigned URLs sign the Host header; pass the origin's, not ours.
            proxy_set_header Host $origin_host;
            proxy_set_header Range $slice_range;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_ssl_server_name on;
            proxy_ssl_name $origin_name;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate ${WAVY_CACHE_CA_FILE};

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            # Never follow or rewrite redirects; wavy refuses them.
            proxy_redirect off;
        }

        location / {
            return 404;
        }
    }
---
# -------------------------------------------------------------------------------------
# 2. The cache's disk: 100 Gi. nginx's cap (WAVY_CACHE_MAX_SIZE below) is 90g, so the
#    disk never fills: nginx evicts old slices in the background and can briefly go
#    over its cap. Raise both together, keeping the cap ~10% under the disk.
# -------------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wavy-cache
  namespace: wavy
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  accessModes: ["ReadWriteOnce"]            # one pod mounts it read-write
  # storageClassName: fast-ssd              # CHANGE ME if you have one (SSD is best); else the cluster default
  resources:
    requests:
      storage: 100Gi                        # size of the disk
---
# -------------------------------------------------------------------------------------
# 3. The cache itself: one nginx pod, shared by every wavy-server replica. When it
#    restarts, wavy reads S3 directly until it's back.
# -------------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wavy-cache
  namespace: wavy
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  replicas: 1                               # one pod: the disk is ReadWriteOnce
  revisionHistoryLimit: 5
  strategy:
    type: Recreate                          # stop the old pod first so it lets go of the disk
  selector:
    matchLabels:
      app.kubernetes.io/name: wavy-cache    # which pods this Deployment owns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wavy-cache  # must match the selector above
        app.kubernetes.io/part-of: wavy
    spec:
      automountServiceAccountToken: false   # nginx never talks to the Kubernetes API
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                      # the nginx user in the unprivileged image
        runAsGroup: 101
        fsGroup: 101                        # the disk is writable by that group
        fsGroupChangePolicy: OnRootMismatch # don't re-chown 100 Gi of slices on every start
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28.0-alpine  # CHANGE ME to your registry's copy if pods can't pull from Docker Hub
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Origin hosts it may fetch from, as a regex on host[:port]. Same bucket(s)
            # as REMOTE_ALLOWED_HOSTS in wavy.yaml. Single quotes keep the backslashes.
            - name: WAVY_CACHE_HOSTS
              value: '^evidence\.s3\.eu-west-1\.amazonaws\.com$'   # CHANGE ME
            - name: WAVY_CACHE_MAX_SIZE
              value: 90g                    # disk cap; least recently used slices go first
            - name: WAVY_CACHE_INACTIVE
              value: 24h                    # slices nobody read for this long are dropped
            - name: WAVY_CACHE_SLICE
              value: 4m                     # each file is fetched and kept in 4 MB pieces
            - name: WAVY_CACHE_DIR
              value: /var/cache/nginx/wavy  # where the disk is mounted
            - name: WAVY_CACHE_CA_FILE
              value: /etc/ssl/certs/ca-certificates.crt  # to check S3's https certificate
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"                    # use the cluster DNS to look up the bucket host
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          resources:                        # requests = limits, like wavy-server
            requests:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # writes go only to the volumes below
            capabilities:
              drop: ["ALL"]
          readinessProbe:                   # in the Service only while this answers
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:                    # restarted if this stops answering
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx/wavy   # the 100 Gi disk
            - name: templates
              mountPath: /etc/nginx/templates    # the site from ConfigMap #1
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d       # the filled-in site is written here
            - name: tmp
              mountPath: /tmp                    # nginx's pid file and temp files
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: wavy-cache           # the disk from #2
        - name: templates
          configMap:
            name: wavy-cache-config         # ConfigMap #1
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
# -------------------------------------------------------------------------------------
# 4. The in-cluster address wavy uses: http://wavy-cache:8080
# -------------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: wavy-cache
  namespace: wavy
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  type: ClusterIP                           # reachable inside the cluster only
  selector:
    app.kubernetes.io/name: wavy-cache      # sends traffic to the pod from #3
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# -------------------------------------------------------------------------------------
# 5. Only wavy-server pods may talk to the cache. Cached slices are served without
#    asking S3 again, so nothing else may reach it. Needs a CNI that enforces
#    NetworkPolicy (Calico, Cilium, ...).
# -------------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wavy-cache
  namespace: wavy
  labels:
    app.kubernetes.io/name: wavy-cache
    app.kubernetes.io/part-of: wavy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wavy-cache    # applies to the cache pod
  policyTypes: ["Ingress"]                  # limits who may connect in; outgoing is open (S3)
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wavy-server   # wavy-server pods only
      ports:
        - port: http
          protocol: TCP
