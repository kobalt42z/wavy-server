name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  angular-client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/angular/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
