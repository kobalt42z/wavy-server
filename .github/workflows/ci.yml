name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # The Angular package (@wavy/angular) is built with Angular 20, the oldest supported
  # major, so the same build works in 20, 21 and 22 apps.
  angular-package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/angular/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --pack-destination ..
        working-directory: clients/angular/dist/wavy
      - uses: actions/upload-artifact@v4
        with:
          name: wavy-angular
          path: |
            clients/angular/dist/wavy
            clients/angular/dist/*.tgz
          if-no-files-found: error

  # Each supported Angular major: run the tests with it, build the library with it, and
  # build an app with it against the package built above (what users install).
  angular-compat:
    needs: angular-package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        angular: [20, 21, 22]
    defaults:
      run:
        working-directory: clients/angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/use-angular.mjs ${{ matrix.angular }}
      - run: npm install --no-audit --no-fund
      - run: npx ng version
      - run: npm test
      - name: Build the library with this Angular
        run: npx ng build wavy && rm -rf dist/wavy
      - uses: actions/download-artifact@v4
        with:
          name: wavy-angular
          path: clients/angular/dist
      - name: Build an app against the published package
        run: npx ng build demo --configuration packaged

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t wavy-server:ci .
      - name: Smoke test (non-root, read-only root filesystem, read-only media)
        run: |
          mkdir -p media
          docker run --rm --user 0 -v "$PWD/media:/out" --entrypoint ffmpeg wavy-server:ci -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25:duration=6 -f lavfi -i sine=duration=6 \
            -c:v mpeg2video -c:a ac3 /out/clip.ts
          docker run -d --name wavy -p 8080:8080 --read-only --tmpfs /tmp:uid=1000,gid=1000 \
            -v "$PWD/media:/media:ro" wavy-server:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          # Distroless has no shell or coreutils, so ask Bun for the uid.
          test "$(docker exec wavy bun -e 'console.log(process.getuid())')" = 1000
          curl -fsS "localhost:8080/api/probe?path=clip.ts" | tee /dev/stderr | grep -q '"mode":"transcode"'
          url=$(curl -fsS -X POST localhost:8080/api/sessions -H 'Content-Type: application/json' -d '{"path":"clip.ts"}' | tee /dev/stderr | jq -r .url)
          curl -fsS "localhost:8080$url" | tee /dev/stderr | grep -q '#EXTINF'
          curl -fsS localhost:8080/metrics | grep -q '^wavy_active_transcodes 1'
      - name: Container logs
        if: always()
        run: docker logs wavy || true
      # Prints every finding, then fails on any CRITICAL or HIGH one (the usual bar for
      # a corporate image scan). Trivy runs from its image pinned by digest.
      - name: CVE scan (Trivy)
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 "$@"
          }
          trivy image --scanners vuln wavy-server:ci
          trivy image --scanners vuln --skip-db-update --severity CRITICAL,HIGH --exit-code 1 wavy-server:ci
